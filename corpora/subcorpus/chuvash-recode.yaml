- rule: short-a
  conditions:
    - attribute: label
      relation: ==
      set: ʌ
  return: "AH"
- rule: long-a
  conditions:
    - attribute: label
      relation: ==
      set: ɑ
  return: "AA"
- rule: back-u
  conditions:
    - attribute: label
      relation: ==
      set: u
  return: "UW"
- rule: front-u
  conditions:
    - attribute: label
      relation: ==
      set: y
  return: "UX"
- rule: short-e
  conditions:
    - attribute: label
      relation: ==
      set: ɛ
  return: "EH"
- rule: long-e
  conditions:
    - attribute: label
      relation: ==
      set: e
  return: "EY"
- rule: o
  conditions:
    - attribute: label
      relation: ==
      set: o
  return: "OW"
- rule: i
  conditions:
    - attribute: label
      relation: ==
      set: i
  return: "IY"
- rule: back-i
  conditions:
    - attribute: label
      relation: ==
      set: ɯ
  return: "IX"
